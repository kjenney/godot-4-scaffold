name: "Example: Hello World (Web Export)"

on:
  push:
    branches: [main]
    paths:
      - "examples/hello-world/**"
  workflow_dispatch:

jobs:
  export-web:
    name: Web Export
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/4.3.stable \
             ~/.local/share/godot/export_templates/4.3.stable

      - name: Web Export
        run: |
          cd examples/hello-world
          mkdir -v -p builds/web
          godot --headless --verbose --export-release "Web"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-world-web
          path: examples/hello-world/builds/web

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@releases/v4
        with:
          branch: gh-pages
          folder: examples/hello-world/builds/web
          target-folder: examples/hello-world
