name: "Godot 4 CI"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: GDScript lint
    strategy:
      matrix:
        godot-version: [4.3]
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:${{ matrix.godot-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${{ matrix.godot-version }}.stable \
             ~/.local/share/godot/export_templates/${{ matrix.godot-version }}.stable

      - name: Lint
        run: |
          godot --headless --path . --doctool .

      - name: Install Python3 and pip for gdlint
        run: |
          apt-get update && apt-get install -y python3 python3-pip
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user "gdtoolkit==4.*"

      - name: GDScript lint with gdlint
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          gdlint source/

  export-windows:
    name: Windows Export
    strategy:
      matrix:
        godot-version: [4.3]
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:${{ matrix.godot-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${{ matrix.godot-version }}.stable \
             ~/.local/share/godot/export_templates/${{ matrix.godot-version }}.stable

      - name: Windows Build
        run: |
          mkdir -v -p build/windows
          EXPORT_DIR="$(readlink -f build)"
          godot --headless --verbose --export-release "Windows Desktop" \
                "$EXPORT_DIR/windows/godot-scaffold.exe"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows

  export-linux:
    name: Linux Export
    strategy:
      matrix:
        godot-version: [4.3]
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:${{ matrix.godot-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${{ matrix.godot-version }}.stable \
             ~/.local/share/godot/export_templates/${{ matrix.godot-version }}.stable

      - name: Linux Build
        run: |
          mkdir -v -p build/linux
          EXPORT_DIR="$(readlink -f build)"
          godot --headless --verbose --export-release "Linux/X11" \
                "$EXPORT_DIR/linux/godot-scaffold.x86_64"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/linux

  export-web:
    name: Web Export
    strategy:
      matrix:
        godot-version: [4.3]
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:${{ matrix.godot-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${{ matrix.godot-version }}.stable \
             ~/.local/share/godot/export_templates/${{ matrix.godot-version }}.stable

      - name: Web Build
        run: |
          mkdir -v -p build/web
          EXPORT_DIR="$(readlink -f build)"
          godot --headless --verbose --export-release "Web" \
                "$EXPORT_DIR/web/index.html"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@releases/v4
        with:
          branch: gh-pages
          folder: build/web

  export-mac:
    name: Mac Export
    strategy:
      matrix:
        godot-version: [4.3]
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:${{ matrix.godot-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${{ matrix.godot-version }}.stable \
             ~/.local/share/godot/export_templates/${{ matrix.godot-version }}.stable

      - name: Mac Build
        run: |
          mkdir -v -p build/mac
          EXPORT_DIR="$(readlink -f build)"
          godot --headless --verbose --export-release "macOS" \
                "$EXPORT_DIR/mac/godot-scaffold.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: build/mac
