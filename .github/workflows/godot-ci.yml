name: "Godot 4 CI"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lint:
    name: GDScript lint
    strategy:
      matrix:
        godot-version: [4.3]
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:${{ matrix.godot-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${{ matrix.godot-version }}.stable \
             ~/.local/share/godot/export_templates/${{ matrix.godot-version }}.stable

      - name: Lint
        run: |
          godot --headless --path . --doctool .

      - name: Install Python3 and pip for gdlint
        run: |
          apt-get update && apt-get install -y python3 python3-pip
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user "gdtoolkit==4.*"

      - name: GDScript lint with gdlint
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          gdlint source/

  export-linux:
    name: Linux Export
    strategy:
      matrix:
        godot-version: [4.3]
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:${{ matrix.godot-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${{ matrix.godot-version }}.stable \
             ~/.local/share/godot/export_templates/${{ matrix.godot-version }}.stable

      - name: Linux Build
        run: |
          mkdir -v -p build/linux
          EXPORT_DIR="$(readlink -f build)"
          godot --headless --verbose --export-release "Linux/X11" \
                "$EXPORT_DIR/linux/godot-scaffold.x86_64"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/linux

  export-web:
    name: Web Export
    strategy:
      matrix:
        godot-version: [4.3]
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:${{ matrix.godot-version }}
    # Prevent overlapping deployments to gh-pages when multiple pushes land in quick succession.
    # cancel-in-progress: true ensures only the latest run deploys; older runs are cancelled before deploy.
    # NOTE: cancel-in-progress can only be set on jobs that have a concurrency group on ALL steps that deploy.
    # Since we have two deploy steps, we need a different approach: use cancel-in-progress and accept
    # that a cancelled run won't deploy at all (safer than a race condition).
    concurrency:
      group: gh-pages-export
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${{ matrix.godot-version }}.stable \
             ~/.local/share/godot/export_templates/${{ matrix.godot-version }}.stable

      - name: Web Build
        run: |
          mkdir -v -p build/web
          EXPORT_DIR="$(readlink -f build)"
          godot --headless --verbose --export-release "Web" \
                "$EXPORT_DIR/web/index.html"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web

      - name: Deploy to GitHub Pages (scaffold)
        uses: JamesIves/github-pages-deploy-action@releases/v4
        with:
          branch: gh-pages
          folder: build/web
          target-folder: scaffold
          clean-exclude: |
            examples/

      - name: Wait for scaffold deploy to settle
        run: sleep 5

      - name: Deploy index.html (gh-pages root)
        uses: JamesIves/github-pages-deploy-action@releases/v4
        with:
          branch: gh-pages
          folder: .
          target-folder: .
          clean-exclude: |
            scaffold/
            examples/
          clean: false

  export-mac:
    name: Mac Export
    strategy:
      matrix:
        godot-version: [4.3]
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:${{ matrix.godot-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${{ matrix.godot-version }}.stable \
             ~/.local/share/godot/export_templates/${{ matrix.godot-version }}.stable

      - name: Mac Build
        run: |
          mkdir -v -p build/mac
          EXPORT_DIR="$(readlink -f build)"
          godot --headless --verbose --export-release "macOS" \
                "$EXPORT_DIR/mac/godot-scaffold.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: build/mac
