name: "Example: RPG Demo (Web Export)"

on:
  push:
    branches: [main]
    paths:
      - "examples/rpg-demo/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-web:
    name: Web Export
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/4.3.stable \
             ~/.local/share/godot/export_templates/4.3.stable

      - name: Web Export
        run: |
          cd examples/rpg-demo
          mkdir -v -p builds/web
          godot --headless --verbose --export-release "Web" \
                "builds/web/index.html"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpg-demo-web
          path: examples/rpg-demo/builds/web

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@releases/v4
        with:
          branch: gh-pages
          folder: examples/rpg-demo/builds/web
          target-folder: examples/rpg-demo
          clean-exclude: |
            scaffold/
            hello-world/
            index.html
